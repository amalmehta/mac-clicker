<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFF8DF"/>
      <stop offset="1" stop-color="#F8DD93"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6B4E0E" flood-opacity="0.2"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5A430E" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- The ring it draws on your screen to show where to click -->
  <circle cx="430" cy="430" r="178" fill="#FFFFFF" fill-opacity="0.55" stroke="#12A08A" stroke-width="36"/>
  <!-- The pointer, landing in the ring -->
  <path filter="url(#lift)" d="M430 430 L430 790 L520 702 L582 840 L648 810 L588 676 L712 676 Z" fill="#2A2C35" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
</svg>
